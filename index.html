<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente Biográfico</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23C97B2A%22%2F%3E%3Cpath%20d%3D%22M16%209c-3-1.6-7-1.6-9-1v15c2-0.6%206-0.6%209%201%203-1.6%207-1.6%209-1V8c-2-0.6-6-0.6-9%201z%22%20fill%3D%22%23F7F2EA%22%2F%3E%3Cpath%20d%3D%22M16%209v15%22%20stroke%3D%22%23C97B2A%22%20stroke-width%3D%221.4%22%2F%3E%3Cpath%20d%3D%22M7.8%2011.6c1.6-0.4%204-0.4%205.7%20.4M7.8%2014.4c1.6-0.4%204-0.4%205.7%20.4M18.5%2012c1.7-0.8%204.1-0.8%205.7-.4M18.5%2014.8c1.7-0.8%204.1-0.8%205.7-.4%22%20stroke%3D%22%23C97B2A%22%20stroke-width%3D%220.9%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%20opacity%3D%220.55%22%2F%3E%3Crect%20x%3D%2214.7%22%20y%3D%222.5%22%20width%3D%222.6%22%20height%3D%226%22%20rx%3D%220.6%22%20fill%3D%22%23C97B2A%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:       #F7F2EA;
      --parchment:   #EDE4D3;
      --ink:         #2B2416;
      --ink-mid:     #5C4F3A;
      --ink-light:   #75664F;
      --amber:       #C97B2A;
      --amber-light: #E8A84E;
      --amber-pale:  #FBF0DE;
      --amber-deep:  #A0601A;
      --red-warn:    #B03A2E;
      --success:     #059669;
      --radius:      10px;
      --shadow:      0 2px 16px rgba(43,36,22,.06);
      --transition:  .25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(201,123,42,.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(201,123,42,.04) 0%, transparent 50%);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.65;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 3.5rem 0 2.5rem;
      margin-bottom: 2.5rem;
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      margin: 0 auto;
      margin-top: 2rem;
    }
    header .ornament {
      font-size: 1.1rem;
      color: var(--amber);
      letter-spacing: .35em;
      margin-bottom: 1rem;
      display: block;
      opacity: .7;
    }
    header h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.7rem, 4.5vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.2;
      color: var(--amber-deep);
    }
    header p.subtitle {
      color: var(--ink-light);
      font-size: 1rem;
      margin-top: .6rem;
      font-weight: 300;
      font-style: italic;
      font-family: 'Lora', serif;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--parchment);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      animation: fadeUp .45s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress ───────────────────────────────────────── */
    #progress-wrap { margin-bottom: 2rem; }
    #progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--ink-light);
      margin-bottom: .5rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #progress-bar {
      height: 3px;
      background: var(--parchment);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      /* Progresso âmbar → teal: caminho do calor pessoal rumo à conclusão (marca) */
      background: var(--amber-deep);
      border-radius: 99px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── Chapter header ─────────────────────────────────── */
    .chapter-eyebrow {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .chapter-number {
      font-family: 'Lora', serif;
      font-size: .8rem;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: .8;
    }
    .chapter-number-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--parchment), transparent);
    }
    .chapter-title {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      color: var(--ink);
      font-weight: 600;
      font-style: italic;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }
    .question-text {
      position: relative;
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-family: 'Lora', serif;
      font-style: italic;
      padding-left: 1.5rem;
      border-left: 3px solid var(--amber-light);
    }
    .question-text::before {
      content: '\201C';                 /* aspa de abertura decorativa */
      position: absolute;
      left: .45rem;
      top: -.35rem;
      font-family: 'Lora', serif;
      font-size: 2.1rem;
      line-height: 1;
      color: var(--amber-light);
      opacity: .55;
    }

    /* ── Textarea ───────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 140px;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      padding: .9rem 1.1rem;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
      line-height: 1.7;
    }
    textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.10);
      background: #fff;
    }
    textarea::placeholder { color: var(--ink-light); font-style: italic; }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .75rem 1.75rem;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      letter-spacing: .01em;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: #fff;
      box-shadow: 0 2px 12px rgba(201,123,42,.25);
    }
    .btn-primary:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(201,123,42,.35);
    }
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--parchment);
      color: var(--ink-mid);
    }
    .btn-secondary:not(:disabled):hover { background: var(--parchment); }
    .btn-row {
      display: flex;
      gap: .75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* ── Inputs ─────────────────────────────────────────── */
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: .75rem 1.1rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.10);
      background: #fff;
    }
    select { appearance: none; cursor: pointer; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: .45rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .field { margin-bottom: 1.35rem; }

    /* ── Language selector ──────────────────────────────── */
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: .65rem;
      margin-bottom: 1.5rem;
    }
    .lang-btn {
      padding: .75rem .5rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      background: #fff;
      font-size: .88rem;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition);
      color: var(--ink-mid);
      font-family: 'Inter', sans-serif;
    }
    .lang-btn:hover { border-color: var(--amber-light); background: var(--amber-pale); }
    .lang-btn.selected { border-color: var(--amber); background: var(--amber-pale); color: var(--amber); font-weight: 600; }
    .lang-flag { font-size: 1.4rem; display: block; margin-bottom: .25rem; }

    /* ── AI follow-up ───────────────────────────────────── */
    .ai-followup-wrap {
      margin: 1.25rem 0;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(135deg, #fffbf4, var(--amber-pale));
      border-radius: var(--radius);
      border: 1px solid rgba(201,123,42,.2);
      position: relative;
    }
    .ai-followup-wrap::before {
      content: '\201C';
      position: absolute;
      top: -.1rem;
      left: 1rem;
      font-family: 'Lora', serif;
      font-size: 3rem;
      color: var(--amber-light);
      line-height: 1;
      opacity: .5;
    }
    .ai-followup-label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: .5rem;
    }
    .ai-followup-text {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink-mid);
      line-height: 1.7;
      padding-left: .5rem;
    }

    /* ── Answer label ───────────────────────────────────── */
    .answer-label {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-light);
      margin-bottom: .5rem;
      display: block;
    }

    /* ── Spinner ────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Notices ────────────────────────────────────────── */
    .notice {
      padding: .8rem 1.1rem;
      border-radius: var(--radius);
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .notice.error { background: #fdf3f2; border: 1px solid #e8b4b1; color: var(--red-warn); }
    .notice.info  { background: var(--amber-pale); border: 1px solid var(--amber-light); color: var(--ink-mid); }

    /* ── Chapter summary list ───────────────────────────── */
    .chapter-list { list-style: none; }
    .chapter-list li {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--parchment);
      font-size: .93rem;
      color: var(--ink-mid);
    }
    .chapter-list li:last-child { border: none; }
    .chap-num { font-family: 'Lora', serif; font-weight: 600; color: var(--amber); min-width: 1.4rem; }
    .chap-done { color: var(--success); font-weight: 600; font-size: .78rem; margin-left: auto; }

    /* ── Manuscript review ──────────────────────────────── */
    .review-intro { color: var(--ink-mid); margin: .5rem 0 1.5rem; }
    .review-meta { display: grid; gap: 1rem; margin-bottom: 1.5rem; }
    .review-meta label, .review-chapter label { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-mid); margin-bottom: .35rem; }
    .review-meta input, .review-meta textarea, .review-chapter textarea {
      width: 100%; border: 1px solid var(--parchment); border-radius: 8px;
      background: #fff; color: var(--ink); font: inherit; padding: .75rem .85rem;
    }
    .review-meta textarea { min-height: 90px; resize: vertical; }
    .review-chapter { margin: 1rem 0; padding: 1.25rem; border: 1px solid var(--parchment); border-radius: var(--radius); background: #fff; }
    .review-chapter h3 { font-family: 'Lora', serif; color: var(--ink); font-size: 1.15rem; margin-bottom: .75rem; }
    .review-chapter textarea { min-height: 230px; resize: vertical; line-height: 1.75; }
    .review-chapter-actions { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-top: .75rem; }
    .review-hint { color: var(--ink-light); font-size: .78rem; }
    .review-sources { margin-top: 1rem; padding-top: .75rem; border-top: 1px solid var(--parchment); color: var(--ink-mid); font-size: .86rem; }
    .review-sources summary { cursor: pointer; font-weight: 600; }
    .review-source-item { margin-top: .8rem; white-space: pre-wrap; }
    .review-error { color: var(--red-warn); font-size: .88rem; margin: .5rem 0; }

    /* ── Photo upload ───────────────────────────────────── */
    .photo-upload-area {
      border: 2px dashed var(--parchment);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      margin-top: 1.25rem;
      color: var(--ink-light);
      font-size: .88rem;
    }
    .photo-upload-area:hover { border-color: var(--amber-light); background: var(--amber-pale); }
    .photo-upload-area input[type=file] { display: none; }
    .photo-thumbs { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; justify-content: center; }
    .photo-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid var(--parchment); filter: sepia(80%); }

    /* ── Generation loading ─────────────────────────────── */
    .gen-loading {
      text-align: center;
      padding: 2rem 1rem;
    }
    .gen-loading .gen-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.08); }
    }
    .gen-loading .gen-chapter {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--ink-mid);
      margin-bottom: .5rem;
    }
    .gen-loading .gen-phrase {
      font-size: .88rem;
      color: var(--ink-light);
    }

    /* ── Cover card ─────────────────────────────────────── */
    .cover-section-title {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink-mid);
      margin-bottom: 1.25rem;
    }

    /* ── Final screen ───────────────────────────────────── */
    .final-hero {
      text-align: center;
      padding: 2rem 1rem;
    }
    .final-hero .book-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
    }
    .final-hero h2 {
      font-family: 'Lora', serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: .75rem;
      color: var(--ink);
    }
    .final-hero .final-name {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--amber);
      margin-bottom: 1rem;
    }
    .final-hero p {
      color: var(--ink-mid);
      max-width: 460px;
      margin: 0 auto 1.75rem;
      line-height: 1.75;
      font-size: .97rem;
    }

    /* ── Divider ornament ───────────────────────────────── */
    .ornament-divider {
      text-align: center;
      color: var(--amber-light);
      letter-spacing: .3em;
      font-size: .85rem;
      margin: 1.5rem 0;
      opacity: .6;
    }

    /* ── Key guide (onboarding) ─────────────────────────── */
    .key-option {
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.1rem;
      background: var(--cream);
    }
    .key-option.recommended {
      border-color: var(--amber);
      background: var(--amber-pale);
    }
    .key-option-head {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .65rem;
    }
    .key-option-name {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
    }
    .key-badge {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #fff;
      background: var(--amber-deep);
      padding: .2rem .55rem;
      border-radius: 99px;
    }
    .key-steps {
      margin: 0 0 1rem 1.1rem;
      padding: 0;
      color: var(--ink-mid);
      font-size: .92rem;
      line-height: 1.6;
    }
    .key-steps li { margin-bottom: .35rem; }
    .key-option .btn { width: 100%; justify-content: center; text-decoration: none; }

    @media (max-width: 520px) {
      .card { padding: 1.5rem; }
      .btn-row { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <span class="ornament">✦  ✦  ✦</span>
    <h1 id="main-title">Agente Biográfico</h1>
    <p class="subtitle" id="main-subtitle">Conte a sua história. Preserve para sempre.</p>
  </header>
  <div id="screen"></div>
</div>

function getBackupSnapshot() {
  return {
    schemaVersion: 2,
    lang: state.lang,
    authorName: state.authorName,
    answers: state.answers,
    chapterNotes: state.chapterNotes,
    narratives: state.narratives,
    bookTitle: state.bookTitle,
    bookSubtitle: state.bookSubtitle,
    dedication: state.dedication,
    savedAt: new Date().toISOString(),
  };
}

function validateBackupSnapshot(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
  if (value.schemaVersion !== 2 || !LANGS[value.lang]) return false;
  if (typeof value.authorName !== 'string' || value.authorName.length > 200) return false;
  if (!Array.isArray(value.answers) || value.answers.length > 100) return false;
  if (!Array.isArray(value.narratives) || value.narratives.length > 8) return false;
  if (typeof value.savedAt !== 'string' || !Number.isFinite(Date.parse(value.savedAt))) return false;
  if (!['bookTitle', 'bookSubtitle', 'dedication'].every(key =>
    typeof value[key] === 'string' && value[key].length <= 10000)) return false;
  if (!value.narratives.every(item => typeof item === 'string' && item.length <= 100000)) return false;

  const chapterCount = LANGS[value.lang].chapters.length;
  const notes = value.chapterNotes ?? {};
  if (!notes || typeof notes !== 'object' || Array.isArray(notes) ||
      !Object.entries(notes).every(([index, note]) => Number.isInteger(Number(index)) &&
        Number(index) >= 0 && Number(index) < chapterCount && typeof note === 'string' && note.length <= 3000)) return false;
  return value.answers.every(answer => answer && typeof answer === 'object' &&
    Number.isInteger(answer.chapterIdx) && answer.chapterIdx >= 0 && answer.chapterIdx < chapterCount &&
    ['chapter', 'question', 'answer', 'followup', 'followupAnswer'].every(key =>
      typeof answer[key] === 'string' && answer[key].length <= 20000));
}

let lastBackupSaveSucceeded = true;
function saveLocalBackup() {
  try {
    localStorage.setItem('bio_backup', JSON.stringify(getBackupSnapshot()));
    lastBackupSaveSucceeded = true;
  } catch (error) {
    lastBackupSaveSucceeded = false;
  }
  return lastBackupSaveSucceeded;
}

let backupSaveTimer;
function scheduleLocalBackup() {
  clearTimeout(backupSaveTimer);
  backupSaveTimer = setTimeout(() => updateDraftStatus(saveLocalBackup()), 500);
}

function hasLocalDraftContent() {
  return state.answers.length > 0 || Object.values(state.chapterNotes || {}).some(note => typeof note === 'string' && note.trim());
}

function updateDraftStatus(saved) {
  const status = document.getElementById('draft-save-status');
  if (!status) return;
  if (!hasLocalDraftContent()) {
    status.textContent = '';
    status.classList.remove('review-error');
    return;
  }
  status.textContent = saved ? t().draftSavedLabel : t().draftSaveError;
  status.classList.toggle('review-error', !saved);
}

function safeFileName(value) {
  const normalized = String(value || '')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 80);
  return normalized || 'memorias';
}

  $('progress-fill').style.width = pct + '%';
  $('progress-current').textContent = `${t().progressLabel} ${current} ${t().of} ${total}${chapterName ? ' — ' + chapterName : ''}`;
  $('progress-pct').textContent = pct + '%';
}

const AI_REQUEST_TIMEOUT_MS = 90000;

async function requestAIJson(url, options) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), AI_REQUEST_TIMEOUT_MS);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    const payload = await response.json().catch(() => null);
    if (!response.ok) {
      const providerMessage = payload?.error?.message || payload?.message;
      const safeMessage = typeof providerMessage === 'string' ? providerMessage.slice(0, 300) : response.statusText;
      throw new Error(`AI provider request failed (${response.status}): ${safeMessage || 'unknown error'}`);
    }
    if (!payload || typeof payload !== 'object') throw new Error('AI provider returned an invalid response');
    return payload;
  } catch (error) {
    if (controller.signal.aborted) throw new Error('AI request timed out');
    if (error instanceof Error && error.message.startsWith('AI provider')) throw error;
    throw new Error('Could not reach the selected AI provider');
  } finally {
    clearTimeout(timeoutId);
  }
}

async function callAI(systemPrompt, userMessage, maxTokens = 600) {
  const p = state.provider;
  const key = state.apiKey;
  if (!PROVIDERS[p] || typeof key !== 'string' || !key.trim()) throw new Error('Choose a provider and enter its API key');

  if (p === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${PROVIDERS.gemini.model}:generateContent`;
    const data = await requestAIJson(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userMessage }] }],
        generationConfig: { maxOutputTokens: maxTokens },
      }),
    });
    const text = data.candidates?.[0]?.content?.parts?.map(part => part.text).filter(Boolean).join('').trim();
    if (!text) throw new Error('AI provider returned no text');
    return text;
  }

  if (p === 'groq') {
    const data = await requestAIJson('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: PROVIDERS.groq.model,
        max_tokens: maxTokens,
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }],
      }),
    });
    const text = data.choices?.[0]?.message?.content;
    if (typeof text !== 'string' || !text.trim()) throw new Error('AI provider returned no text');
    return text.trim();
  }

  if (p === 'openai') {
    const data = await requestAIJson('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: PROVIDERS.openai.model,
        max_completion_tokens: maxTokens,
        reasoning_effort: maxTokens > 1000 ? 'low' : 'none',
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }],
      }),
    });
    const text = data.choices?.[0]?.message?.content;
    if (typeof text !== 'string' || !text.trim()) throw new Error('AI provider returned no text');
    return text.trim();
  }

  if (p !== 'claude') throw new Error('Selected AI provider is not supported');
  const data = await requestAIJson('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: PROVIDERS.claude.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  const text = data.content?.filter(block => block.type === 'text').map(block => block.text).filter(Boolean).join('').trim();
  if (!text) throw new Error('AI provider returned no text');
  return text;
}

- Empieza con una escena o detalle concreto proporcionado. Si no hay material suficiente, comienza directamente en lugar de inventar una escena.
- Ordena los hechos de forma coherente. No inventes una cronología; usa transiciones neutras si el orden no está claro.
- Conserva expresiones distintivas que reflejen la voz de la persona. Evita adornos genéricos, clichés, repeticiones y tono de homenaje promocional.
- Escribe de dos a cinco párrafos, con la extensión que el material permita. Sé conciso si las respuestas son breves; no rellenes con sentimientos implícitos ni reflexiones genéricas.
- No incluyas el título del capítulo, instrucciones, notas editoriales ni una moraleja. Responde solo con el texto del capítulo.`,

  };

  const sys = systemMap[lang] || systemMap.en;
  let user = `Capítulo: ${chapterTitle}\n\n`;
  for (const qa of qas) {
    user += `P: ${qa.question}\nR: ${qa.answer || '(sem resposta)'}\n`;
    if (qa.followup && qa.followupAnswer) {
      user += `P (aprofundamento): ${qa.followup}\nR: ${qa.followupAnswer}\n`;
    }
    user += '\n';
  }
  const contextLabel = {
    pt: 'Contexto adicional informado pela pessoa',
    en: 'Additional context supplied by the person',
    de: 'Zusätzlicher Kontext der Person',
    es: 'Contexto adicional aportado por la persona',
  }[lang] || 'Additional context supplied by the person';
  if (chapterNote.trim()) user += `${contextLabel}:\n${chapterNote.trim()}\n`;
  return callAI(sys, user, 2200);
}

//  IMAGE PROCESSING
// ═══════════════════════════════════════════════════════
async function fileToSepiaBase64(file, maxPx = 1200) {
  const maxBytes = 15 * 1024 * 1024;
  const supportedTypes = new Set(['image/jpeg', 'image/png', 'image/webp', 'image/avif', 'image/gif', 'image/bmp']);
  if (!file || !supportedTypes.has(file.type) || file.size <= 0 || file.size > maxBytes) {
    throw new Error('Unsupported or oversized image');
  }

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (!w || !h || w * h > 40000000) { reject(new Error('Image dimensions exceed the supported limit')); return; }
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (!ctx) { reject(new Error('Could not process image')); return; }
        ctx.drawImage(img, 0, 0, w, h);
        const imageData = ctx.getImageData(0, 0, w, h);
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          d[i]   = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
          d[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
          d[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => reject(new Error('Could not decode image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read image'));
    reader.readAsDataURL(file);
  });
}

async function composeMosaic(b64list, targetW = 1200) {
  if (b64list.length === 1) return b64list[0];
  return new Promise((resolve) => {
    const imgs = [];
    let loaded = 0;
    for (const src of b64list) {
      const img = new Image();
      img.onload = () => { loaded++; if (loaded === b64list.length) buildMosaic(); };
      img.src = src;
      imgs.push(img);
    }
    function buildMosaic() {
      const n = imgs.length;
      const cols = n <= 2 ? n : n <= 4 ? 2 : 3;
      const rows = Math.ceil(n / cols);
      const cellW = Math.floor(targetW / cols);
      const cellH = cellW;
      const canvas = document.createElement('canvas');
      canvas.width = cols * cellW; canvas.height = rows * cellH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#F7F2EA';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      imgs.forEach((img, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const x = col * cellW + 2, y = row * cellH + 2;
        const w = cellW - 4, h = cellH - 4;
        const scale = Math.max(w / img.width, h / img.height);
        const sw = img.width * scale, sh = img.height * scale;
        const sx = (sw - w) / 2, sy = (sh - h) / 2;
        ctx.drawImage(img, -sx / scale, -sy / scale, img.width, img.height, x, y, w, h);
      });
      resolve(canvas.toDataURL('image/jpeg', 0.88));
    }
  });
}

async function fetchCoverImage() {
  const prompt = encodeURIComponent(
    'vintage sepia memoir book cover, warm candlelight, handwritten pages, old photographs, soft bokeh, painterly, nostalgic, no text, no identifiable person'
  );
  const url = `https://image.pollinations.ai/prompt/${prompt}?width=800&height=1100&nologo=true&seed=${Date.now()}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) return null;
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
  finally { clearTimeout(timeoutId); }
}

function base64ToBytes(b64) {
  const raw = b64.includes(',') ? b64.split(',')[1] : b64;
  const bin = atob(raw);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// ═══════════════════════════════════════════════════════
//  DOCX GENERATION
// ═══════════════════════════════════════════════════════
async function deflateRaw(data) {
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(data); writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })());
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

async function buildZip(files) {
  const enc = new TextEncoder();
  const entries = [];
  let offset = 0;
  const parts = [];
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const compressed = await deflateRaw(f.data);
    const crc = crc32(f.data);
    const localHeader = new Uint8Array([
      0x50,0x4B,0x03,0x04, 0x14,0x00, 0x00,0x00, 0x08,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(crc), ...u32le(compressed.length), ...u32le(f.data.length),
      ...u16le(nameBytes.length), 0x00,0x00, ...nameBytes,
    ]);
    entries.push({ nameBytes, crc, compSize: compressed.length, uncompSize: f.data.length, offset });
    parts.push(localHeader, compressed);
    offset += localHeader.length + compressed.length;
  }
  const cdParts = [];
  for (const e of entries) {
    cdParts.push(new Uint8Array([
      0x50,0x4B,0x01,0x02, 0x14,0x00,0x14,0x00, 0x00,0x00, 0x08,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(e.crc), ...u32le(e.compSize), ...u32le(e.uncompSize),
      ...u16le(e.nameBytes.length),
      0x00,0x00, // extra field length
      0x00,0x00, // file comment length
      0x00,0x00, // disk number start
      0x00,0x00, // internal file attributes
      0x00,0x00,0x00,0x00, // external file attributes
      ...u32le(e.offset), ...e.nameBytes,
    ]));
  }
  const cdData = concat(cdParts);
  const eocd = new Uint8Array([
    0x50,0x4B,0x05,0x06, 0x00,0x00,0x00,0x00,
    ...u16le(entries.length), ...u16le(entries.length),
    ...u32le(cdData.length), ...u32le(offset), 0x00,0x00,
  ]);
  return concat([...parts, cdData, eocd]);
}

function concat(arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}

function xmlEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function makeParaXml(text, opts = {}) {
  const { bold, size = 24, color = '2B2416', center = false, italic = false,
          pageBreak = false, spaceBefore = 0, spaceAfter = 200,
          firstIndent = 0, heading = false } = opts;
  const pPr = `<w:pPr>
    ${heading ? `<w:pStyle w:val="Heading1"/>` : ''}

    ${pageBreak ? `<w:pageBreakBefore/>` : ''}
    <w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}" w:line="340" w:lineRule="auto"/>
    <w:widowControl/>
    ${heading ? '<w:keepNext/>' : ''}
    ${firstIndent ? `<w:ind w:firstLine="${firstIndent}"/>` : ''}
  </w:pPr>`;
  const rPr = `<w:rPr>

  <Override PartName="/word/styles.xml"   ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
  <Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>
  <Override PartName="/word/footer1.xml"  ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>
  <Override PartName="/word/footer2.xml"  ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>
  <Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
  ${imgContentTypes}
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>
  <Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer2.xml"/>
  ${imgRelEntries}
</Relationships>`;

  const files = [
    { name: '[Content_Types].xml',          data: enc.encode(contentTypesXml) },
    { name: '_rels/.rels',                  data: enc.encode(rootRelsXml) },
    { name: 'word/document.xml',            data: enc.encode(documentXml) },
    { name: 'word/styles.xml',              data: enc.encode(stylesXml) },
    { name: 'word/settings.xml',            data: enc.encode(settingsXml) },
    { name: 'word/footer1.xml',             data: enc.encode(footerXml) },
    { name: 'word/footer2.xml',             data: enc.encode(firstPageFooterXml) },
    { name: 'docProps/core.xml',            data: enc.encode(corePropertiesXml) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(relsXml) },
    ...imageFiles,
  ];

  const zipData = await buildZip(files);
  return new Blob([zipData], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function renderLangScreen() {
  screen().innerHTML = `
    <div class="card">
      <p style="font-family:'Lora',serif; font-size:1.05rem; margin-bottom:1.5rem; color:var(--ink-mid); font-style:italic;">
        Choose a language / Escolha o idioma / Sprache wählen / Elige un idioma
      </p>
      <div class="lang-grid">
        ${Object.entries(LANGS).map(([code, l]) => `
          <button class="lang-btn" data-lang="${code}">
            <span class="lang-flag">${l.flag}</span>
            ${l.label}
          </button>
        `).join('')}
      </div>
      <div style="margin-top:1.25rem; text-align:center;">
        <label class="btn btn-secondary" for="backup-import-input" style="cursor:pointer;">${LANGS.pt.ui.backupImport} / Import backup</label>
        <input id="backup-import-input" type="file" accept="application/json,.json" style="display:none;" />
        <p style="font-size:.8rem; color:var(--ink-light); margin:.5rem 0 0;">${LANGS.pt.ui.backupImportHint}</p>
        <p id="backup-import-status" class="review-error" aria-live="polite" style="margin:.5rem 0 0;"></p>
      </div>
    </div>
  `;

  const importInput = document.getElementById('backup-import-input');
  importInput.addEventListener('change', async event => {
    const file = event.target.files?.[0];
    if (!file) return;
    const status = document.getElementById('backup-import-status');
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error('Backup exceeds 5 MB');
      const candidate = JSON.parse(await file.text());
      if (!validateBackupSnapshot(candidate)) throw new Error('Invalid backup structure');
      if (!window.confirm(LANGS[candidate.lang].ui.backupImportConfirm)) return;
      candidate.chapterNotes ||= {};
      localStorage.setItem('bio_backup', JSON.stringify(candidate));
      state.lang = candidate.lang;
      renderLangScreen();
    } catch (error) {
      status.textContent = LANGS[state.lang]?.ui.backupImportError || LANGS.pt.ui.backupImportError;
    } finally {
      event.target.value = '';
    }
  });

  try {
    const backup = localStorage.getItem('bio_backup');
    if (backup) {
      const b = JSON.parse(backup);
      if (!validateBackupSnapshot(b)) throw new Error('Invalid local backup');
      const ui = LANGS[b.lang]?.ui;
      const saved = new Date(b.savedAt).toLocaleString();
      const banner = document.createElement('div');
      banner.className = 'notice info';
      banner.style.cssText = 'margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;';
      banner.innerHTML = `
        <span>💾 ${ui ? ui.backupFound : 'Session found'}: <strong>${escapeHtml(b.authorName)}</strong> — ${b.answers.length} respostas (${saved})</span>
        <div class="btn-row" style="margin:0; gap:.5rem;">
          <button id="restore-btn" class="btn btn-secondary" style="font-size:.82rem; padding:.4rem .9rem;">${ui ? ui.backupRestore : 'Restore'}</button>
          <button id="delete-backup-btn" class="btn btn-secondary" style="font-size:.82rem; padding:.4rem .9rem;">${ui ? ui.backupDelete : 'Delete saved session'}</button>
        </div>
      `;
      screen().prepend(banner);
      document.getElementById('delete-backup-btn').addEventListener('click', () => {
        if (!window.confirm(ui?.backupDeleteConfirm || 'Delete the saved session from this browser?')) return;
        try {
          localStorage.removeItem('bio_backup');
          banner.remove();
        } catch (error) {
          const message = document.createElement('p');
          message.className = 'review-error';
          message.textContent = ui?.draftSaveError || 'Could not delete the saved session.';
          banner.appendChild(message);
        }
      });
      document.getElementById('restore-btn').addEventListener('click', () => {
        state.lang       = b.lang;
        state.authorName = b.authorName;
        state.answers    = b.answers;
        state.chapterNotes = b.chapterNotes || {};
        state.narratives = Array.isArray(b.narratives) ? b.narratives : [];
        state.narrativeErrors = {};
        state.bookTitle = typeof b.bookTitle === 'string' ? b.bookTitle : '';
        state.bookSubtitle = typeof b.bookSubtitle === 'string' ? b.bookSubtitle : '';
        state.dedication = typeof b.dedication === 'string' ? b.dedication : '';
        // Calculate real position from saved answers
        const chaps = LANGS[b.lang].chapters;
        let totalQ = 0;
        for (let ci = 0; ci < chaps.length; ci++) {
          for (let qi = 0; qi < chaps[ci].questions.length; qi++) {
            if (totalQ >= b.answers.length) {
              state.chapterIdx = ci; state.questionIdx = qi;
              break;
            }
            totalQ++;
          }
          if (totalQ >= b.answers.length) break;
        }
        if (b.answers.length >= chaps.reduce((s,c)=>s+c.questions.length,0)) {
          const completedNarratives = chaps.every((chapter, index) => {
            const hasAnswers = b.answers.some(answer => answer.chapterIdx === index && answer.answer);
            return !hasAnswers || Boolean(state.narratives[index]?.trim());
          });
          if (completedNarratives) {
            const byChapter = {};
            for (const answer of state.answers) {
              if (!byChapter[answer.chapterIdx]) byChapter[answer.chapterIdx] = [];
              byChapter[answer.chapterIdx].push(answer);
            }
            renderReviewScreen(byChapter, chaps);
            return;
          }
          renderGenerateScreen(); return;
        }
        document.getElementById('main-title').textContent    = LANGS[b.lang].ui.appTitle;
        document.getElementById('main-subtitle').textContent = LANGS[b.lang].ui.appSubtitle;
        document.documentElement.lang = b.lang;
        renderQuestionScreen();
      });
    }
  } catch(e) {
    const errorBanner = document.createElement('div');
    errorBanner.className = 'notice error';
    errorBanner.innerHTML = `<span>${LANGS[state.lang]?.ui.backupCorrupt || LANGS.pt.ui.backupCorrupt}</span> <button id="delete-corrupt-backup" class="btn btn-secondary" type="button">${LANGS.pt.ui.backupDelete}</button>`;
    screen().prepend(errorBanner);
    document.getElementById('delete-corrupt-backup').addEventListener('click', () => {
      if (!window.confirm(LANGS[state.lang]?.ui.backupDeleteConfirm || LANGS.pt.ui.backupDeleteConfirm)) return;
      try {
        localStorage.removeItem('bio_backup');
        errorBanner.remove();
      } catch(error) {
        errorBanner.querySelector('span').textContent = LANGS.pt.ui.draftSaveError;
      }
    });
  }

  screen().querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lang = btn.dataset.lang;
      document.getElementById('main-title').textContent    = LANGS[state.lang].ui.appTitle;
      document.getElementById('main-subtitle').textContent = LANGS[state.lang].ui.appSubtitle;
      document.documentElement.lang = state.lang;
      renderKeyGuideScreen();
    });
  });
}

function renderQuestionScreen() {
  const ui    = t();
  const chaps = chapters();
  const chap  = chaps[state.chapterIdx];
  let question = chap.questions[state.questionIdx];

  if (state.chapterIdx === 0 && state.questionIdx === 0 && state.authorName) {
    const greetMap = {
      pt: `${escapeHtml(state.authorName)}, qual lugar, pessoa ou rotina representa melhor o começo da sua história? Conte uma cena concreta que você lembra.`,
      en: `${escapeHtml(state.authorName)}, what place, person, or routine best represents the beginning of your story? Describe a concrete scene you remember.`,
      de: `${escapeHtml(state.authorName)}, welcher Ort, Mensch oder Alltag steht für den Anfang Ihrer Geschichte? Beschreiben Sie eine konkrete Szene, an die Sie sich erinnern.`,
      es: `${escapeHtml(state.authorName)}, ¿qué lugar, persona o rutina representa mejor el comienzo de tu historia? Cuenta una escena concreta que recuerdes.`,
    };
    question = greetMap[state.lang] || question;
  }

  state.followupQuestion = null;
  state.awaitingFollowup = false;
  state.pendingAnswer    = '';

  const canGoBack = state.chapterIdx > 0 || state.questionIdx > 0;
  const chapNum   = state.chapterIdx + 1;

  screen().innerHTML = `
    <div id="progress-wrap">
      <div id="progress-label">
        <span id="progress-current"></span>
        <span id="progress-pct"></span>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="card" id="question-card">
      <div class="chapter-eyebrow">
        <span class="chapter-number">${ui.progressLabel} ${chapNum}</span>
        <span class="chapter-number-line"></span>
      </div>
      <div class="chapter-title">${chap.title}</div>
      <div class="question-text">${question}</div>

      <div id="ai-response-zone"></div>

      <span class="answer-label" id="answer-label">${ui.yourAnswerLabel}</span>
      <textarea id="answer-box" placeholder="..." rows="5"></textarea>

      <div class="photo-upload-area" id="photo-drop">
        <label for="photo-input" style="cursor:pointer; text-transform:none; letter-spacing:0; font-size:.88rem; font-weight:400; color:var(--ink-light);">
          ${ui.photoLabel}<br>
          <span style="font-size:.78rem;">${ui.photoHint}</span>
        </label>
        <input type="file" id="photo-input" accept="image/*" multiple />
        <div class="photo-thumbs" id="photo-thumbs"></div>
      </div>

      <div class="field" style="margin-top:1rem;">
        <label for="chapter-note">${ui.chapterNoteLabel}</label>
        <textarea id="chapter-note" rows="3" maxlength="3000" placeholder="...">${escapeHtml(state.chapterNotes[chapNum - 1] || '')}</textarea>
        <p style="font-size:.78rem; color:var(--ink-light); margin-top:.35rem;">${ui.chapterNoteHint}</p>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="next-btn">${ui.nextBtn}</button>
        <button class="btn btn-secondary" id="skip-btn">${ui.skipBtn}</button>
        ${canGoBack ? `<button class="btn btn-secondary" id="back-btn" style="margin-left:auto;">← Voltar</button>` : ''}
      </div>
      <p id="draft-save-status" class="review-hint" aria-live="polite" style="margin:.5rem 0 0;"></p>
      <div style="margin-top:.75rem; text-align:right;">
        <button class="btn btn-secondary" id="save-now-btn" style="font-size:.78rem; padding:.35rem .85rem; color:var(--ink-light);">💾 ${ui.backupBtn.replace('⬇ ','')}</button>
      </div>
    </div>
  `;

  setProgress(chapNum, chaps.length, chap.title);
  updateDraftStatus(hasLocalDraftContent() ? lastBackupSaveSucceeded : true);
  $('chapter-note').addEventListener('input', event => {
    const note = event.target.value;
    if (note.trim()) state.chapterNotes[chapNum - 1] = note;
    else delete state.chapterNotes[chapNum - 1];
    scheduleLocalBackup();
  });

  $('next-btn').addEventListener('click', () => handleNextClick(question, chap.title));
  $('skip-btn').addEventListener('click', () => {
    if (state.awaitingFollowup) {
      advanceQuestion(question, chap.title, state.pendingAnswer, state.followupQuestion, '');
    } else {
      advanceQuestion(question, chap.title, '', null, '');
    }
  });

  if (canGoBack) {
    $('back-btn').addEventListener('click', () => {
      if (state.questionIdx > 0) { state.questionIdx--; }
      else { state.chapterIdx--; state.questionIdx = chaps[state.chapterIdx].questions.length - 1; }
      if (state.answers.length > 0) state.answers.pop();
      renderQuestionScreen();
    });
  }

  $('save-now-btn').addEventListener('click', () => {
    if (!state.answers.length) { showError(ui.errorNoAnswers); return; }
    const data = JSON.stringify(getBackupSnapshot(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${safeFileName(state.authorName)}_respostas.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  const chapIdx = state.chapterIdx;
  const thumbs  = $('photo-thumbs');
  if (state.photos[chapIdx]) {
    for (const b64 of state.photos[chapIdx]) {
      const img = document.createElement('img');
      img.className = 'photo-thumb'; img.src = b64; thumbs.appendChild(img);
    }
  }
  async function addPhoto(file) {
    try {
      const b64 = await fileToSepiaBase64(file, 1200);
      if (!state.photos[chapIdx]) state.photos[chapIdx] = [];
      state.photos[chapIdx].push(b64);
      const img = document.createElement('img');
      img.className = 'photo-thumb'; img.src = b64; img.alt = ui.photoLabel;
      thumbs.appendChild(img);
    } catch (error) {
      showError(ui.imageError);
    }
  }
  $('photo-input').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) await addPhoto(file);
    e.target.value = '';
  });
  $('photo-drop').addEventListener('dragover', e => { e.preventDefault(); $('photo-drop').style.borderColor = 'var(--amber)'; });
  $('photo-drop').addEventListener('dragleave', () => { $('photo-drop').style.borderColor = ''; });
  $('photo-drop').addEventListener('drop', async (e) => {
    e.preventDefault(); $('photo-drop').style.borderColor = '';
    const files = Array.from(e.dataTransfer.files || []);
    for (const file of files) await addPhoto(file);
  });
}

async function handleNextClick(question, chapterTitle) {
  const ui     = t();
  const answer = $('answer-box').value.trim();

  if (!state.awaitingFollowup) {
    if (!answer) return;
    state.pendingAnswer    = answer;
    state.awaitingFollowup = true;
    const nextBtn = $('next-btn'), skipBtn = $('skip-btn');
    nextBtn.disabled = skipBtn.disabled = true;
    nextBtn.innerHTML = `<span class="spinner"></span> ${ui.thinking}`;
    try {
      const fq = await getFollowupQuestion(chapterTitle, question, answer);
      state.followupQuestion = fq;
      $('ai-response-zone').innerHTML = `
        <div class="ai-followup-wrap">
          <div class="ai-followup-label">${ui.aiAsksLabel}</div>
          <div class="ai-followup-text">${escapeHtml(fq)}</div>
        </div>
      `;
      $('answer-label').style.display = 'none';
      $('answer-box').value = '';
      nextBtn.innerHTML = ui.nextBtn;
      nextBtn.disabled = skipBtn.disabled = false;
    } catch (e) {
      advanceQuestion(question, chapterTitle, answer, null, '');
    }
  } else {
    advanceQuestion(question, chapterTitle, state.pendingAnswer, state.followupQuestion, $('answer-box').value.trim());
  }
}

function advanceQuestion(question, chapterTitle, answer, followup, followupAnswer) {
  const chaps = chapters();
  state.answers.push({ chapter: chapterTitle, chapterIdx: state.chapterIdx, question, answer, followup, followupAnswer });
  saveLocalBackup();

  const chap = chaps[state.chapterIdx];
  if (state.questionIdx < chap.questions.length - 1) {
    state.questionIdx++;
  } else if (state.chapterIdx < chaps.length - 1) {
    state.chapterIdx++;
    state.questionIdx = 0;
  } else {
    renderGenerateScreen();
    return;
  }
  renderQuestionScreen();
}

function renderGenerateScreen() {
  const ui    = t();
  const chaps = chapters();
  const byChapter = {};
  for (const a of state.answers) {
    if (!byChapter[a.chapterIdx]) byChapter[a.chapterIdx] = [];
    byChapter[a.chapterIdx].push(a);

  const chapterItems = chaps.map((c, i) => {
    const done = byChapter[i] && byChapter[i].some(a => a.answer);
    return `<li><span class="chap-num">${i+1}</span><span>${c.title}</span>${done ? `<span class="chap-done">✓</span>` : ''}</li>`;
  }).join('');

  screen().innerHTML = `
    <div class="card">
      <p style="font-family:'Lora',serif; font-style:italic; color:var(--ink-mid); margin-bottom:1.25rem; font-size:1rem;">${ui.chaptersProgress}</p>
      <ul class="chapter-list">${chapterItems}</ul>
      <div class="btn-row" style="margin-top:1.5rem;">
        <button class="btn btn-secondary" id="backup-btn">${ui.backupBtn}</button>
      </div>

          width:160px; height:220px; margin:0 auto;
          background:var(--parchment); border-radius:var(--radius);
          display:flex; align-items:center; justify-content:center;
          color:var(--ink-light); font-size:.82rem; border:1.5px dashed var(--amber-light);
          font-family:'Lora',serif; font-style:italic;
        ">${ui.coverNone}</div>
        <img id="cover-preview" src="" alt="Cover" style="
          display:none; width:160px; border-radius:var(--radius);
          box-shadow:var(--shadow); filter:sepia(20%);
        "/>
      </div>
      <div class="btn-row" style="justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="gen-cover-btn">${ui.coverGenerate}</button>
        <button class="btn btn-secondary" id="regen-cover-btn" style="display:none;">${ui.coverRegenerate}</button>
        <label class="btn btn-secondary" for="cover-upload-input" style="cursor:pointer;">${ui.coverUpload}</label>
        <input type="file" id="cover-upload-input" accept="image/*" style="display:none;"/>
      </div>
      <p id="cover-status" style="text-align:center; font-size:.82rem; color:var(--ink-light); margin-top:.75rem;"></p>
      <p style="text-align:center; font-size:.78rem; color:var(--ink-light);">${ui.coverPrivacyNotice}</p>
      <div class="ornament-divider">✦ ✦ ✦</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="generate-btn" style="padding:.85rem 2.5rem; font-size:1rem;">${ui.finishBtn}</button>
      </div>
      <div id="gen-status"></div>
    </div>
  `;

  $('backup-btn').addEventListener('click', () => {
    const data = JSON.stringify(getBackupSnapshot(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${safeFileName(state.authorName)}_respostas.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  function showCoverPreview(b64) {
    state.coverImageB64 = b64;
    $('cover-placeholder').style.display = 'none';
    const img = $('cover-preview');
    img.src = b64; img.style.display = 'block';
    $('regen-cover-btn').style.display = 'inline-flex';
    $('cover-status').textContent = '';
  }

  async function doGenCover() {
    $('gen-cover-btn').disabled = $('regen-cover-btn').disabled = true;
    $('cover-status').innerHTML = `<span class="spinner" style="border-top-color:var(--amber);border-color:rgba(201,123,42,.2);vertical-align:middle;display:inline-block;"></span> ${ui.coverGenerating}`;
    const b64 = await fetchCoverImage();
    $('gen-cover-btn').disabled = $('regen-cover-btn').disabled = false;
    if (b64) { showCoverPreview(b64); }
    else { $('cover-status').textContent = ui.coverError; }
  }

  $('gen-cover-btn').addEventListener('click', doGenCover);
  $('regen-cover-btn').addEventListener('click', doGenCover);
  $('cover-upload-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const b64 = await fileToSepiaBase64(file, 800);
      showCoverPreview(b64);
    } catch (error) {
      showError(ui.imageError);
    } finally {
      e.target.value = '';
    }
  });
  if (state.coverImageB64) showCoverPreview(state.coverImageB64);

  $('generate-btn').addEventListener('click', () => runGeneration(byChapter, chaps));
}

async function runGeneration(byChapter, chaps) {
  const ui     = t();
  const genBtn = $('generate-btn');
  const status = $('gen-status');

  // Safety net: a restored session has no API key in memory. Ask for it inline.
  if (!state.apiKey) {
    status.innerHTML = `
      <div class="card" style="margin-top:1rem; box-shadow:none; border-color:var(--amber-light);">
        <div class="field">
          <label>${ui.providerLabel}</label>
          <select id="gen-provider-select">
            <option value="groq" selected>🟢 ${PROVIDERS.groq.label}</option>
            <option value="gemini">🟢 ${PROVIDERS.gemini.label}</option>
            <option value="openai">🔵 ${PROVIDERS.openai.label}</option>
            <option value="claude">🔵 ${PROVIDERS.claude.label}</option>
          </select>
        </div>
        <div class="field">
          <label>${ui.apiKeyLabel}</label>
          <input type="password" id="gen-api-key" placeholder="${PROVIDERS[state.provider].placeholder}" autocomplete="off" />
          <p style="font-size:.8rem; color:var(--ink-light); margin-top:.4rem;">
            <a id="gen-get-key-link" href="${PROVIDERS[state.provider].keyUrl}" target="_blank" rel="noopener"
               style="color:var(--amber); text-decoration:none; font-weight:600;">🔑 ${ui.getKeyLabel} ↗</a>
          </p>
        </div>
        <div class="field" style="display:flex; align-items:flex-start; gap:.65rem; color:var(--ink-mid); font-size:.86rem;">
          <input type="checkbox" id="gen-api-consent" style="margin-top:.35rem; flex:0 0 auto;" />
          <label for="gen-api-consent" style="font-weight:400; text-transform:none; letter-spacing:0;">${escapeHtml(ui.apiConsentLabel)}</label>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="gen-key-confirm">${ui.finishBtn}</button>
        </div>
      </div>`;
    $('gen-provider-select').addEventListener('change', () => {
      const p = $('gen-provider-select').value;
      $('gen-api-key').placeholder = PROVIDERS[p].placeholder;
      $('gen-get-key-link').href   = PROVIDERS[p].keyUrl;
    });
    $('gen-key-confirm').addEventListener('click', () => {
      if (!$('gen-api-consent').checked) { showError(ui.apiConsentLabel); return; }
      const k = $('gen-api-key').value.trim();
      if (!k) { showError(ui.errorApiKey); return; }
      state.provider = $('gen-provider-select').value;
      state.apiKey   = k;
      state.apiConsent = true;
      status.innerHTML = '';
      runGeneration(byChapter, chaps);
    });
    return;
  }

  genBtn.disabled = true;
  genBtn.innerHTML = `<span class="spinner" style="border-top-color:var(--amber);border-color:rgba(201,123,42,.2);"></span> ${ui.generating}`;

  // Emotional loading state
  status.innerHTML = `
    <div class="gen-loading">
      <span class="gen-icon">${ui.genLoadingIcon}</span>
      <div class="gen-chapter" id="gen-chapter-name">${chaps[0].title}…</div>
      <div class="gen-phrase">${ui.genPhrase}</div>
    </div>
  `;

  state.narratives = [];
  state.narrativeErrors = {};
  for (let i = 0; i < chaps.length; i++) {
    const qas = byChapter[i];
    const chapNameEl = document.getElementById('gen-chapter-name');
    if (chapNameEl) chapNameEl.textContent = `${chaps[i].title}…`;
    if (!qas || !qas.some(a => a.answer)) { state.narratives.push(null); continue; }
    try {
      state.narratives.push(await generateNarrative(chaps[i].title, qas, state.chapterNotes[i] || ''));
    } catch (e) {
      state.narratives.push('');
      state.narrativeErrors[i] = e.message || 'Generation failed';
    }
  }

  saveLocalBackup();
  renderReviewScreen(byChapter, chaps);
}

function renderReviewScreen(byChapter, chaps) {
  const ui = t();
  if (!state.bookTitle) {
    const defaults = { pt: `Memórias de ${state.authorName}`, en: `Memoirs of ${state.authorName}`, de: `Erinnerungen von ${state.authorName}`, es: `Memorias de ${state.authorName}` };
    state.bookTitle = defaults[state.lang] || defaults.en;
  }
  const chapterCards = chaps.map((chapter, index) => {
    const qas = byChapter[index] || [];
    if (!qas.some(qa => qa.answer)) return '';
    const sourceItems = qas.filter(qa => qa.answer).map(qa => `
      <div class="review-source-item"><strong>${escapeHtml(qa.question)}</strong><br>${escapeHtml(qa.answer)}${qa.followupAnswer ? `<br><br><strong>${escapeHtml(qa.followup)}</strong><br>${escapeHtml(qa.followupAnswer)}` : ''}</div>
    `).join('');
    const chapterNote = state.chapterNotes[index]?.trim();
    const error = state.narrativeErrors?.[index];
    return `
      <section class="review-chapter" data-chapter-index="${index}">
        <h3>${escapeHtml(chapter.title)}</h3>
        ${error ? `<p class="review-error" role="alert">${escapeHtml(ui.regenerateError)}</p>` : ''}
        <label for="review-text-${index}">${escapeHtml(ui.chapterTextLabel)}</label>
        <textarea id="review-text-${index}" data-narrative-index="${index}">${escapeHtml(state.narratives[index] || '')}</textarea>
        <label for="chapter-note-review-${index}">${escapeHtml(ui.chapterNoteLabel)}</label>
        <textarea id="chapter-note-review-${index}" data-chapter-note-index="${index}" rows="3" maxlength="3000">${escapeHtml(chapterNote || '')}</textarea>
        <p class="review-hint">${escapeHtml(ui.chapterNoteHint)}</p>
        <div class="review-chapter-actions">
          <span class="review-hint">${escapeHtml(ui.reviewChapterHint)}</span>
          <button class="btn btn-secondary" type="button" data-regenerate-index="${index}">${escapeHtml(ui.regenerateChapter)}</button>
        </div>
        <details class="review-sources"><summary>${escapeHtml(ui.sourcesLabel)}</summary>${sourceItems}<div class="review-source-item" data-note-preview-index="${index}" style="${chapterNote ? '' : 'display:none;'}"><strong>${escapeHtml(ui.chapterNoteSource)}</strong><br><span>${escapeHtml(chapterNote || '')}</span></div></details>
      </section>
    `;
  }).join('');

  screen().innerHTML = `
    <div class="card">
      <h2>${escapeHtml(ui.reviewTitle)}</h2>
      <p class="review-intro">${escapeHtml(ui.reviewIntro)}</p>
      <p id="draft-save-status" class="review-hint" aria-live="polite"></p>
      <div class="review-meta">
        <div><label for="book-title">${escapeHtml(ui.bookTitleLabel)}</label><input id="book-title" maxlength="140" value="${escapeHtml(state.bookTitle)}"></div>
        <div><label for="book-subtitle">${escapeHtml(ui.bookSubtitleLabel)}</label><input id="book-subtitle" maxlength="180" value="${escapeHtml(state.bookSubtitle)}"></div>
        <div><label for="book-dedication">${escapeHtml(ui.dedicationLabel)}</label><textarea id="book-dedication" maxlength="600" placeholder="${escapeHtml(ui.dedicationPlaceholder)}">${escapeHtml(state.dedication)}</textarea></div>
      </div>
      ${chapterCards || `<p class="review-error">${escapeHtml(ui.errorNoAnswers)}</p>`}
      <div class="btn-row" style="justify-content:flex-end; margin-top:1rem;">
        <button class="btn btn-primary" id="assemble-book">${escapeHtml(ui.createBook)}</button>
      </div>
      <div id="assembly-error"></div>
    </div>
  `;

  updateDraftStatus(saveLocalBackup());

  $('book-title').addEventListener('input', event => { state.bookTitle = event.target.value; scheduleLocalBackup(); });
  $('book-subtitle').addEventListener('input', event => { state.bookSubtitle = event.target.value; scheduleLocalBackup(); });
  $('book-dedication').addEventListener('input', event => { state.dedication = event.target.value; scheduleLocalBackup(); });
  document.querySelectorAll('[data-narrative-index]').forEach(textarea => {
    textarea.addEventListener('input', event => { state.narratives[Number(event.target.dataset.narrativeIndex)] = event.target.value; scheduleLocalBackup(); });
  });
  document.querySelectorAll('[data-chapter-note-index]').forEach(textarea => {
    textarea.addEventListener('input', event => {
      const index = Number(event.target.dataset.chapterNoteIndex);
      const note = event.target.value;
      if (note.trim()) state.chapterNotes[index] = note;
      else delete state.chapterNotes[index];
      const preview = document.querySelector(`[data-note-preview-index="${index}"]`);
      if (preview) {
        preview.querySelector('span').textContent = note;
        preview.style.display = note.trim() ? '' : 'none';
      }
      scheduleLocalBackup();
    });
  });
  document.querySelectorAll('[data-regenerate-index]').forEach(button => {
    button.addEventListener('click', async () => {
      const index = Number(button.dataset.regenerateIndex);
      const textarea = $(`review-text-${index}`);
      button.disabled = true;
      button.textContent = ui.regenerateWorking;
      try {
        const revised = await generateNarrative(chaps[index].title, byChapter[index], state.chapterNotes[index] || '');
        state.narratives[index] = revised;
        delete state.narrativeErrors[index];
        textarea.value = revised;
        textarea.focus();
        button.closest('.review-chapter').querySelector('.review-error')?.remove();
        button.disabled = false;
        button.textContent = ui.regenerateChapter;
      } catch (error) {
        state.narrativeErrors[index] = error.message || 'Generation failed';
        const card = button.closest('.review-chapter');
        let notice = card.querySelector('.review-error');
        if (!notice) {
          notice = document.createElement('p');
          notice.className = 'review-error';
          notice.setAttribute('role', 'alert');
          card.insertBefore(notice, card.querySelector('label'));
        }
        notice.textContent = ui.regenerateError;
        button.disabled = false;
        button.textContent = ui.regenerateChapter;
      }
      updateDraftStatus(saveLocalBackup());
    });
  });

  $('assemble-book').addEventListener('click', async () => {
    const button = $('assemble-book');
    const errorBox = $('assembly-error');
    state.bookTitle = $('book-title').value.trim();
    state.bookSubtitle = $('book-subtitle').value.trim();
    state.dedication = $('book-dedication').value.trim();
    updateDraftStatus(saveLocalBackup());
    const hasText = state.narratives.some(text => typeof text === 'string' && text.trim());
    const hasErrors = Object.keys(state.narrativeErrors || {}).length > 0;
    if (!hasText || hasErrors) {
      errorBox.innerHTML = `<p class="review-error" role="alert">${escapeHtml(ui.regenerateError)}</p>`;
      return;
    }
    button.disabled = true;
    button.textContent = ui.generating;
    errorBox.textContent = '';
    try {
      state.docxBlob = await generateDocx(state.narratives, state.photos, state.coverImageB64);
      renderFinalScreen();
    } catch (error) {
      button.disabled = false;
      button.textContent = ui.createBook;
      errorBox.textContent = ui.assemblyError;
    }
  });
}

function renderFinalScreen() {
  const ui = t();
  screen().innerHTML = `
    <div class="card final-hero">
      <span class="book-icon">📖</span>
      <h2>${ui.finalTitle}</h2>
      <div class="final-name">${escapeHtml(state.authorName)}</div>
      <p>${escapeHtml(state.bookTitle)}</p>
      <p>${ui.finalMessage}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="dl-btn" style="padding:.85rem 2.25rem;">${ui.downloadBtn}</button>
        <button class="btn btn-secondary" id="restart-btn">${ui.restartBtn}</button>
      </div>
    </div>
  `;

  $('dl-btn').addEventListener('click', () => {
    const filename = `${safeFileName(state.bookTitle || state.authorName)}.docx`;
    const url = URL.createObjectURL(state.docxBlob);
    const a   = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  $('restart-btn').addEventListener('click', () => {
    Object.assign(state, { lang:null, apiKey:'', apiConsent:false, authorName:'', chapterIdx:0, questionIdx:0, answers:[], chapterNotes:{}, docxBlob:null, photos:{}, coverImageB64:null, narratives:[], narrativeErrors:{}, bookTitle:'', bookSubtitle:'', dedication:'' });
    renderLangScreen();
  });
}

// ── Boot ─────────────────────────────────────────────
renderLangScreen();
</script>
</body>
</html>
